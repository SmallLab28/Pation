<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pation WASM Tester</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 30px;
            max-width: 700px;
            margin: 0 auto;
            background: #f8fafc;
            color: #1e293b;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
        }
        input[type="number"], select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        #downloadLink {
            display: block;
            text-align: center;
            margin-top: 16px;
            padding: 10px;
            background: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }
        #log {
            width: 100%;
            height: 160px;
            margin-top: 20px;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            background: #0f172a;
            color: #38bdf8;
            border-radius: 6px;
            border: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Pation PDF Compressor (WASM)</h1>
        
        <div class="form-group">
            <label>Chọn file PDF:</label>
            <input type="file" id="pdfInput" accept="application/pdf">
        </div>

        <div class="form-group">
            <label>Mức DPI (Độ phân giải ảnh):</label>
            <select id="dpiSelect">
                <option value="72">72 DPI - Siêu nén (Chuẩn Ghostscript /screen, nhẹ nhất)</option>
                <option value="150" selected>150 DPI - Mặc định (Cân bằng tốt nhất giữa nét và dung lượng)</option>
                <option value="200">200 DPI - Sắc nét hơn</option>
                <option value="300">300 DPI - Chất lượng cao (In ấn)</option>
                <option value="custom">Tùy chỉnh...</option>
            </select>
            <input type="number" id="customDpi" value="150" style="display: none; margin-top: 8px;" placeholder="Nhập DPI tùy chỉnh">
            <div class="hint">Chất lượng JPEG mặc định được cố định ở mức tối ưu 25.</div>
        </div>

        <button id="compressBtn">Nén PDF</button>
        <a id="downloadLink" style="display: none;">Tải file PDF đã nén</a>
        <textarea id="log" readonly placeholder="Trạng thái hệ thống..."></textarea>
    </div>

    <!-- Nạp script core WASM và wrapper hoàn chỉnh -->
    <script src="pation.js"></script>
    <script src="index.js"></script>
    <script>
        function logMsg(msg) {
            const log = document.getElementById('log');
            log.value += msg + '\n';
            log.scrollTop = log.scrollHeight;
            console.log(msg);
        }

        const dpiSelect = document.getElementById('dpiSelect');
        const customDpi = document.getElementById('customDpi');
        dpiSelect.addEventListener('change', () => {
            if (dpiSelect.value === 'custom') {
                customDpi.style.display = 'block';
            } else {
                customDpi.style.display = 'none';
            }
        });

        // Khởi tạo sẵn module khi load trang
        if (typeof getModule === 'function') {
            getModule().then(() => {
                logMsg("Đã sẵn sàng! Core WebAssembly đã nạp thành công.");
            }).catch(err => {
                logMsg("Lỗi nạp WASM: " + err);
            });
        }

        document.getElementById('compressBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('pdfInput');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert("Vui lòng chọn một file PDF trước.");
                return;
            }

            const file = fileInput.files[0];
            const dpi = dpiSelect.value === 'custom' 
                ? parseInt(customDpi.value) || 150 
                : parseInt(dpiSelect.value);

            const btn = document.getElementById('compressBtn');
            const downloadLink = document.getElementById('downloadLink');
            btn.disabled = true;
            btn.innerText = "Đang nén file...";
            downloadLink.style.display = 'none';

            logMsg(`Bắt đầu nén "${file.name}" (${(file.size / 1024 / 1024).toFixed(2)} MB) với DPI=${dpi}...`);
            const startTime = performance.now();

            try {
                // Sử dụng trực tiếp hàm compressPdf từ wrapper (chỉ cần truyền file và dpi)
                const outData = await compressPdf(file, dpi);
                const endTime = performance.now();

                const originalMb = (file.size / 1024 / 1024).toFixed(2);
                const compressedMb = (outData.length / 1024 / 1024).toFixed(2);
                if (outData.length >= file.size) {
                    logMsg(`Thông báo: File đã được tối ưu tối đa trước đó, không thể nén thêm. Trả về file gốc (${originalMb} MB).`);
                    const blob = new Blob([outData], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    downloadLink.href = url;
                    downloadLink.download = file.name;
                    downloadLink.style.display = 'block';
                    downloadLink.innerText = `Tải file gốc (${originalMb} MB - Đã tối ưu)`;
                } else {
                    const percent = (((file.size - outData.length) / file.size) * 100).toFixed(1);
                    logMsg(`Nén thành công trong ${(endTime - startTime).toFixed(0)} ms!`);
                    logMsg(`Dung lượng: ${originalMb} MB -> ${compressedMb} MB (Giảm ${percent}%)`);

                    const blob = new Blob([outData], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    downloadLink.href = url;
                    downloadLink.download = `compressed_${file.name}`;
                    downloadLink.style.display = 'block';
                    downloadLink.innerText = `Tải file (${compressedMb} MB - Giảm ${percent}%)`;
                }
            } catch (err) {
                logMsg(`Lỗi khi nén: ${err.message || err}`);
            } finally {
                btn.disabled = false;
                btn.innerText = "Nén PDF";
            }
        });
    </script>
</body>
</html>
